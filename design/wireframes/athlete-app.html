<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete App — Blue Fitness</title>
<style>
  :root{--bg:#F8FAFC;--surface:#FFF;--surface-ocean:#E0F2FE;--surface-hover:#F1F5F9;--border:#CBD5E1;--text:#0F172A;--text-muted:#475569;--text-faint:#94A3B8;--accent:#2563EB;--accent-dim:rgba(37,99,235,.08);--accent-text:#FFF;--success:#16A34A;--success-bg:#DCFCE7;--danger:#DC2626;--danger-bg:#FEE2E2;--warning:#D97706;--warning-bg:#FEF3C7;--teal:#0D9488;--teal-bg:rgba(13,148,136,.12);--shadow-md:0 4px 12px rgba(15,23,42,.06);--shadow-lg:0 8px 32px rgba(15,23,42,.12);}
  :root[data-theme="dark"]{--bg:#0F172A;--surface:#1E293B;--surface-ocean:#25334A;--surface-hover:#334155;--border:#334155;--text:#F8FAFC;--text-muted:#94A3B8;--text-faint:#64748B;--accent:#3B82F6;--accent-dim:rgba(59,130,246,.15);--accent-text:#FFF;--success:#22C55E;--success-bg:rgba(34,197,94,.2);--danger:#EF4444;--danger-bg:rgba(239,68,68,.2);--warning:#FBBF24;--warning-bg:rgba(251,191,36,.2);--teal:#2DD4BF;--teal-bg:rgba(45,212,191,.15);--shadow-md:0 4px 12px rgba(0,0,0,.25);--shadow-lg:0 8px 32px rgba(0,0,0,.4);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#E2E8F0;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 16px 60px;}
  body.rtl-body{direction:rtl;}
  .icon{width:20px;height:20px;stroke-width:2;flex-shrink:0;}
  .icon-sm{width:16px;height:16px;}
  .icon-xs{width:13px;height:13px;}
  button{font-family:inherit;}

  .demo-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .demo-note{font-size:11px;color:#64748B;font-weight:700;}
  .seg{display:flex;background:#FFF;border:1px solid #CBD5E1;border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow-md);}
  .seg button{padding:8px 18px;border:none;border-radius:10px;background:transparent;color:#475569;font-size:13px;font-weight:800;cursor:pointer;}
  .seg button.active{background:var(--accent);color:#FFF;}

  /* ==================== PHONE ==================== */
  .phone{position:relative;width:400px;max-width:100%;background:var(--bg);border-radius:40px;border:10px solid #0F172A;box-shadow:0 24px 60px rgba(15,23,42,.35);overflow:hidden;min-height:780px;}
  .ph-status{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 4px;font-size:13px;font-weight:800;}
  .ph-status .icons{display:flex;gap:5px;color:var(--text-muted);}
  .ph-status .icons svg{width:13px;height:13px;}

  .ph-head{display:flex;align-items:center;gap:12px;padding:14px 20px 14px;}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--surface-ocean);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
  .ph-hname{font-size:17px;font-weight:800;}
  .ph-hsub{font-size:11.5px;color:var(--text-muted);margin-top:1px;display:flex;align-items:center;gap:4px;}
  .week-chip{margin-inline-start:auto;background:var(--accent-dim);color:var(--accent);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;white-space:nowrap;}

  .ph-body{padding:4px 18px 90px;height:640px;overflow-y:auto;}
  .ph-body::-webkit-scrollbar{width:0;}

  /* tabs */
  .ph-tabs{position:absolute;bottom:0;inset-inline:0;height:74px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 8px 16px;z-index:20;}
  .ptab{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:800;cursor:pointer;border-radius:12px;position:relative;}
  .ptab.active{color:var(--accent);}
  .ptab .dot{position:absolute;top:8px;inset-inline-end:26%;width:8px;height:8px;border-radius:50%;background:var(--danger);}

  /* week strip */
  .wstrip{display:flex;gap:6px;padding:10px 2px 6px;}
  .ws-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;cursor:pointer;transition:all .15s;}
  .ws-col.today{background:var(--accent);color:var(--accent-text);box-shadow:0 4px 14px rgba(37,99,235,.35);}
  .ws-col.sel{outline:2px solid var(--accent);}
  .ws-day{font-size:12px;font-weight:800;}
  .ws-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25;}
  .ws-col.has .ws-dot{opacity:1;}
  .ws-dot.canceled{background:var(--danger);opacity:1;}

  /* hero (today) */
  .hero{background:linear-gradient(135deg,var(--accent) 0%,#1D4ED8 100%);border-radius:20px;padding:18px;color:#FFF;margin:10px 0 6px;box-shadow:0 10px 28px rgba(37,99,235,.35);}
  .hero-top{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;opacity:.9;}
  .hero-name{font-size:19px;font-weight:800;margin-top:8px;line-height:1.3;}
  .hero-meta{display:flex;gap:12px;margin-top:8px;font-size:11.5px;font-weight:700;opacity:.92;flex-wrap:wrap;}
  .hero-meta span{display:flex;align-items:center;gap:4px;}
  .hero-cta{margin-top:14px;width:100%;border:none;border-radius:14px;padding:13px;background:#FFF;color:var(--accent);font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}

  /* section titles */
  .sec{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--text-muted);margin:18px 4px 8px;}
  .sec svg{color:var(--accent);}

  /* session card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-md);}
  .card:hover{border-color:var(--accent);}
  .card.canceled{opacity:.55;}
  .card.today-card{border-color:var(--accent);background:var(--surface);}
  .c-icon{width:40px;height:40px;border-radius:12px;background:var(--surface-ocean);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;}
  .c-body{flex:1;min-width:0;}
  .c-time{font-size:10.5px;font-weight:800;color:var(--accent);display:flex;gap:5px;align-items:center;}
  .c-name{font-size:13.5px;font-weight:800;line-height:1.3;margin-top:1px;display:flex;align-items:center;gap:6px;}
  .c-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .c-sub s{color:var(--danger);}
  .c-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
  .tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:9.5px;font-weight:800;}
  .tag svg{width:9px;height:9px;}
  .t-group{background:var(--surface-hover);color:var(--text-muted);}
  .t-personal{background:var(--teal-bg);color:var(--teal);}
  .t-adapt{background:var(--accent-dim);color:var(--accent);}
  .t-add{background:var(--success-bg);color:var(--success);}
  .t-cancel{background:var(--danger-bg);color:var(--danger);}
  .t-done{background:var(--success-bg);color:var(--success);}
  .t-att{background:var(--surface-hover);color:var(--text-muted);}
  .c-report{border:none;border-radius:10px;padding:7px 12px;background:var(--accent);color:#FFF;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0;}

  /* event card */
  .ev-card{border:1px dashed var(--border);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;background:var(--surface);}
  .ev-card .icon-xs{color:var(--warning);}
  .ev-card.comp .icon-xs{color:var(--danger);}
  .ev-card.pers .icon-xs{color:var(--teal);}
  .ev-name{font-size:12px;font-weight:800;flex:1;}
  .ev-time{font-size:10.5px;font-weight:800;color:var(--text-muted);}
  .ev-card.clickable{cursor:pointer;transition:border-color .15s, background .15s;}
  .ev-card.clickable:hover{border-color:var(--accent);background:var(--surface-ocean);}

  /* coach note */
  .note-card{background:var(--surface-ocean);border-radius:16px;padding:13px 15px;margin:14px 0 4px;display:flex;gap:10px;align-items:flex-start;}
  .note-card .icon-sm{color:var(--warning);flex-shrink:0;margin-top:1px;}
  .note-card b{font-size:12px;font-weight:800;}
  .note-card p{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.6;}

  /* progress view */
  .pv-hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:12px;text-align:center;box-shadow:var(--shadow-md);}
  .pv-ring{width:120px;height:120px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;position:relative;background:conic-gradient(var(--success) 0% 92%, var(--border) 92% 100%);}
  .pv-ring .inner{width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pv-ring .v{font-size:24px;font-weight:800;color:var(--success);}
  .pv-ring .l{font-size:10px;color:var(--text-faint);font-weight:700;}
  .pv-sub{font-size:11.5px;color:var(--text-muted);font-weight:700;}
  .pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .pv-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;}
  .pv-tile h4{font-size:10.5px;font-weight:800;color:var(--text-faint);letter-spacing:.3px;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
  .pv-tile h4 svg{width:12px;height:12px;color:var(--accent);}
  .pv-big{font-size:16px;font-weight:800;}
  .pv-small{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .zone-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px;font-weight:700;}
  .zone-tag{width:26px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}

  /* messages */
  .msg{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;position:relative;}
  .msg.unread{border-color:var(--accent);background:var(--surface);}
  .msg .unread-dot{position:absolute;top:10px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);}
  .m-icon{width:36px;height:36px;border-radius:10px;background:var(--surface-ocean);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .m-title{font-size:12.5px;font-weight:800;}
  .m-body{font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.55;}
  .m-time{font-size:10px;color:var(--text-faint);font-weight:700;margin-top:4px;}

  /* profile */
  .pf-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:8px;}
  .pf-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;font-weight:700;}
  .pf-row .k{color:var(--text-muted);min-width:74px;}
  .pf-row .v{flex:1;font-weight:800;}
  .pf-btn{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px;color:var(--text-muted);font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;}
  .pf-btn:hover{border-color:var(--accent);color:var(--accent);}
  .pf-btn.danger{color:var(--danger);border-color:var(--danger);}

  /* sheets (workout detail + report) */
  .sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:40;display:none;}
  .sheet-bg.open{display:block;}
  .sheet{position:absolute;bottom:0;inset-inline:0;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 20px 24px;z-index:50;max-height:78%;overflow-y:auto;transform:translateY(100%);transition:transform .25s;display:none;}
  .sheet.open{display:block;animation:slideUp .25s forwards;}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sh-grip{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 12px;}
  .sh-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .sh-title .icon{color:var(--accent);}
  .sh-sub{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;font-weight:700;}
  .sh-adapt{background:var(--accent-dim);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:800;margin-top:10px;display:flex;align-items:center;gap:6px;}
  .step{background:var(--surface-hover);border-radius:12px;padding:11px 13px;margin-top:8px;display:flex;gap:10px;align-items:flex-start;}
  .step-type{min-width:46px;text-align:center;padding:5px 4px;border-radius:8px;font-size:10px;font-weight:800;flex-shrink:0;}
  .st-warmup{background:var(--success-bg);color:var(--success);}
  .st-main{background:var(--accent);color:#fff;}
  .st-cool{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}
  .step-title{font-size:12.5px;font-weight:800;}
  .step-zone{font-size:11px;color:var(--accent);font-weight:800;margin-top:3px;display:flex;align-items:center;gap:4px;}
  .step-note{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .sh-close{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px;color:var(--text-muted);font-size:12.5px;font-weight:800;cursor:pointer;margin-top:14px;}

  /* report sheet */
  .rp-row{display:flex;gap:8px;margin:12px 0 6px;}
  .rp-opt{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--text-muted);}
  .rp-opt.sel-done{border-color:var(--success);background:var(--success-bg);color:var(--success);}
  .rp-opt.sel-miss{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
  .rpe-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .rpe{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:800;cursor:pointer;color:var(--text-muted);}
  .rpe.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
  .rp-input{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit;outline:none;margin-top:10px;resize:none;}
  .rp-save{width:100%;border:none;border-radius:14px;padding:13px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:0 4px 16px rgba(37,99,235,.3);}

  /* ==================== AVAILABILITY ==================== */
  .avail-banner{background:var(--warning-bg);border:1px solid var(--warning);border-radius:14px;padding:11px 13px;margin:12px 0 4px;display:flex;gap:9px;align-items:center;font-size:11.5px;font-weight:800;color:var(--warning);flex-wrap:wrap;}
  .avail-banner .ok-chip{background:var(--success-bg);color:var(--success);border-radius:20px;padding:2px 10px;font-size:9.5px;}
  .avail-cta{width:100%;border:1.5px dashed var(--border);background:transparent;border-radius:14px;padding:12px;color:var(--text-muted);font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;}
  .avail-cta:hover{border-color:var(--accent);color:var(--accent);}

  /* ==================== SHARED INPUTS (sheets) ==================== */
  .jrow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px;font-weight:700;border-bottom:1px dashed var(--border);}
  .jrow:last-of-type{border-bottom:none;}
  .jrow .k{min-width:86px;color:var(--text-muted);flex-shrink:0;}
  .jinput{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--text);font-family:inherit;font-size:12px;width:84px;outline:none;}
  .jchips{display:flex;gap:5px;flex-wrap:wrap;}
  .jchip{padding:5px 11px;border:1.5px solid var(--border);border-radius:18px;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;background:var(--surface);transition:all .15s;}
  .jchip.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
  .jchip.on.ok{border-color:var(--success);background:var(--success-bg);color:var(--success);}
  .jchip.on.bad{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
  .jtextarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--text);font-family:inherit;font-size:12px;outline:none;resize:none;margin-top:9px;}

  /* ==================== COMPETITION JOURNAL v12 — 3 screens ==================== */
  .comp-state{font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:16px;flex-shrink:0;white-space:nowrap;}
  .cs-plan{background:var(--surface-hover);color:var(--text-muted);}
  .cs-sent{background:var(--accent-dim);color:var(--accent);}
  .cs-done{background:var(--success-bg);color:var(--success);}
  .cs-new{background:var(--warning-bg);color:var(--warning);}
  .cd-chip{font-size:9.5px;font-weight:800;color:var(--text-faint);padding:3px 8px;flex-shrink:0;}
  .resp-badge{background:var(--accent-dim);color:var(--accent);border-radius:16px;padding:3px 10px;font-size:9.5px;font-weight:800;flex-shrink:0;display:inline-flex;align-items:center;gap:3px;}
  .resp-badge svg{width:10px;height:10px;}
  .add-comp{width:100%;padding:12px;border:1.5px dashed var(--border);border-radius:14px;background:transparent;color:var(--text-muted);font-size:12.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;margin-bottom:10px;}
  .add-comp:hover{border-color:var(--accent);color:var(--accent);}
  .tpl-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .tpl-item{border:1.5px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:start;font-family:inherit;}
  .tpl-item.on{border-color:var(--accent);background:var(--accent-dim);}
  .tpl-item .t1{font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .tpl-item .t1 svg{width:14px;height:14px;color:var(--accent);}
  .tpl-item.on .t1{color:var(--accent);}
  .tpl-item .t2{font-size:10px;color:var(--text-faint);font-weight:700;line-height:1.4;}
  .stage-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px dashed var(--border);}
  .stage-row:last-of-type{border-bottom:none;}
  .stage-n{flex:1;border:1px solid var(--border);border-radius:8px;padding:6px 9px;background:var(--bg);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;outline:none;min-width:0;}
  .stage-n:focus{border-color:var(--accent);}
  .stage-t{width:56px;border:1px solid var(--border);border-radius:8px;padding:6px 6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:11px;outline:none;text-align:center;flex-shrink:0;}
  .stage-del{border:none;background:transparent;color:var(--text-faint);cursor:pointer;padding:3px;flex-shrink:0;}
  .stage-del:hover{color:var(--danger);}
  .stage-move{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
  .stage-move button{border:none;background:transparent;color:var(--text-faint);cursor:pointer;padding:1px 2px;line-height:0;}
  .stage-move button:hover{color:var(--accent);}
  .st-tabs{display:flex;gap:5px;margin:10px 0 10px;overflow-x:auto;padding-bottom:2px;}
  .st-tabs::-webkit-scrollbar{height:0;}
  .st-tab{flex:0 0 auto;padding:7px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit;}
  .st-tab.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
  .st-tab svg{width:12px;height:12px;}

function renderWeek(){
  const a = A();
  let html = `
    <div class="wstrip">
      ${DAYS.map((d,i)=>{
        const has = a.sessions.some(s=>s.d===i && !s.canceled);
        const canceled = a.sessions.some(s=>s.d===i && s.canceled);
        const cls = `${i===TODAY?'today':''} ${has?'has':''} ${i===selectedDay?'sel':''}`;
        return `<div class="ws-col ${cls}" onclick="selectDay(${i})">
          <span class="ws-day">${d.l}</span>
          <span class="ws-dot ${canceled?'canceled':''}"></span>
        </div>`;
      }).join('')}
    </div>`;

  /* availability banners — athlete-reported constraints the coach plans around */
  (a.avail||[]).forEach(av=>{
    html += `
      <div class="avail-banner">
        <svg class="icon-sm"><use href="#i-clipboard"/></svg>
        <span style="flex:1">${av.type} · ${av.from}–${av.to} · ${av.full?'לא אוכל להתאמן':'אימון מוגבל'}${av.note?` — ${av.note}`:''}</span>
        <span class="ok-chip">${av.status||'נשלח למאמנת'}</span>
      </div>`;
  });

  /* today hero */
  const todaySess = a.sessions.filter(s=>s.d===TODAY && !s.canceled);
  if (todaySess.length){
    const s = todaySess[0];
    html += `
      <div class="hero" onclick="openWorkout('${s.id}')">
        <div class="hero-top"><svg class="icon-sm"><use href="#i-clock"/></svg> היום · ${s.time}</div>
        <div class="hero-name">${s.name}</div>
        <div class="hero-meta">
          ${s.sub ? `<span><svg class="icon-xs"><use href="#i-pin"/></svg> ${s.sub}</span>` : ''}
          ${s.src==='group' ? `<span><svg class="icon-xs"><use href="#i-users"/></svg> אימון קבוצה</span>` : `<span><svg class="icon-xs"><use href="#i-user"/></svg> אישי</span>`}
        </div>
        ${s.adapt ? `<div class="hero-top" style="margin-top:8px"><svg class="icon-sm"><use href="#i-user"/></svg> ${s.adapt}</div>` : ''}
        <button class="hero-cta" onclick="event.stopPropagation();openWorkout('${s.id}')">
          <svg class="icon-sm"><use href="#i-waves"/></svg> פתח אימון
        </button>
      </div>`;
  }

  /* sessions grouped: past → report, upcoming */
  const past = a.sessions.filter(s=>s.d < TODAY || (s.d===TODAY && s.state==='past'));
  const rest = a.sessions.filter(s=>!past.includes(s));

  html += `<div class="sec"><svg class="icon-sm"><use href="#i-check"/></svg> מחכה לדיווח שלך</div>`;
  const toReport = past.filter(s=>!s.canceled && !s.reported);
  const reported = past.filter(s=>s.reported);
  if (!toReport.length && !reported.length) html += `<div style="font-size:11.5px;color:var(--text-faint);padding:6px 4px">אין אימונים לדיווח</div>`;
  toReport.forEach(s=>{ html += sessionCard(s, { report:true }); });
  reported.forEach(s=>{ html += sessionCard(s, {}); });

  html += `<div class="sec"><svg class="icon-sm"><use href="#i-calendar"/></svg> שאר השבוע</div>`;
  rest.forEach(s=>{ html += sessionCard(s, {}); });

  /* events — tapping a competition/test event opens its preparation journal (מסך א׳/ב׳) */
  const evs = a.events || [];
  if (evs.length){
    html += `<div class="sec"><svg class="icon-sm"><use href="#i-note"/></svg> לוח האירועים — לחיצה על תחרות/מבחן פותחת את ההכנה שלו</div>`;
    evs.forEach(ev=>{
      const cd = ev.comp ? (a.comps||[]).find(x=>x.id===ev.comp) : null;
      html += `
        <div class="ev-card ${ev.kind} ${ev.comp?'clickable':''}" ${ev.comp?`onclick="openComp('${ev.comp}')"`:''}>
          <svg class="icon-xs"><use href="#${ev.icon}"/></svg>
          <span class="ev-name">${ev.name}</span>
          <span class="ev-time">${DAYS[ev.d].l}׳ · ${ev.time}${cd?` · בעוד ${cd.daysAway} ימים`:''}</span>
        </div>`;
    });
  }

  /* coach note */
  html += `
    <div class="note-card">
      <svg class="icon-sm"><use href="#i-note"/></svg>
      <div>
        <b>פתק המאמנת לשבוע</b>
        <p>${a.note}</p>
      </div>
    </div>
    <button class="avail-cta" onclick="openAvail()">
      <svg class="icon-sm"><use href="#i-send"/></svg> יש נסיעה / פציעה / מגבלה? הודע למאמנת
    </button>`;

  $('phBody').innerHTML = html;
}

function sessionCard(s, opt){
  const a = A();
  const tags = [];
  if (s.src==='group') tags.push(`<span class="tag t-group"><svg><use href="#i-users"/></svg> קבוצה</span>`);
  if (s.src==='personal') tags.push(`<span class="tag t-personal"><svg><use href="#i-user"/></svg> אישי</span>`);
  if (s.adapt) tags.push(`<span class="tag t-adapt"><svg><use href="#i-user"/></svg> מותאם לך</span>`);
  if (s.added) tags.push(`<span class="tag t-add"><svg><use href="#i-check"/></svg> נוסף במקום הביטול</span>`);
  if (s.canceled) tags.push(`<span class="tag t-cancel"><svg><use href="#i-x"/></svg> בוטל</span>`);
  if (s.reported){
    tags.push(s.reported.done
      ? `<span class="tag t-done"><svg><use href="#i-check"/></svg> דיווחת: RPE ${s.reported.rpe}</span>`
      : `<span class="tag t-cancel"><svg><use href="#i-x"/></svg> לא בוצע</span>`);
  }
  const clickable = !s.canceled && (s.steps || s.src==='group');
  return `
    <div class="card ${s.canceled?'canceled':''} ${s.state==='today'?'today-card':''}" ${clickable?`onclick="openWorkout('${s.id}')"`:''}>
      <div class="c-icon"><svg class="icon"><use href="#${s.icon}"/></svg></div>
      <div class="c-body">
        <div class="c-time"><svg class="icon-xs"><use href="#i-clock"/></svg> ${DAYS[s.d].l}׳ · ${s.time}</div>
        <div class="c-name">${s.canceled?`<s>${s.name}</s>`:s.name}</div>
        <div class="c-sub">${s.canceled ? s.cancelNote : (s.sub||'')}</div>
        ${tags.length?`<div class="c-tags">${tags.join('')}</div>`:''}
      </div>
      ${opt.report ? `<button class="c-report" onclick="event.stopPropagation();openReport('${s.id}')">דווח</button>` : ''}
    </div>`;
}

function compCard(c){
  const stMap = { new:['מבנה חדש — לבנות מתבניות','cs-new'], plan:['בתכנון — ממלאים את השלבים','cs-plan'], sent:['הוכן ונשלח למאמנת','cs-sent'], done:['הושלמה · תחקיר נסגר','cs-done'] };
  const st = stMap[c.state] || stMap.plan;
  const coachRe = c.state==='sent' && (c.stages||[]).some(s=>s.coach);
  const filled = (c.stages||[]).filter(s=>s.str && s.str.trim()).length;
  const total = (c.stages||[]).length;
  return `
    <div class="comp-card up comp-list-card" onclick="openComp('${c.id}')">
      <div class="comp-head">
        <svg class="icon" style="${c.kind==='test'?'color:var(--warning)':'color:var(--danger)'}"><use href="#${c.kind==='test'?'i-clipboard':'i-trophy'}"/></svg>
        <div class="comp-name">${c.name}<div class="comp-sub">${c.date} · ${c.place}</div></div>
        <svg class="icon" style="color:var(--text-faint)"><use href="#i-chevron-left"/></svg>
      </div>
      <div class="comp-head" style="margin-top:6px;flex-wrap:wrap;gap:5px">
        <span class="comp-state ${st[1]}">${st[0]}</span>
        <span class="cd-chip">בעוד ${c.daysAway||0} ימים</span>
        ${coachRe?`<span class="resp-badge"><svg><use href="#i-msg"/></svg> המאמנת הגיבה</span>`:''}
        ${c.state==='plan'&&total?`<span class="cd-chip" style="margin-inline-start:auto">${filled}/${total} שלבים מתוכננים</span>`:''}
      </div>

}
/* past competition — closed debrief: side-by-side planned מול actual + coach notes */
function compPastCard(c){

            <div class="sb-row">
              <div class="sb-plan">${p.tx}</div>

/* screen routing */
function openComp(id){
  const c = getComp(id);
  jw = { comp:id, screen:(c && c.state==='new') ? 'build':'plan', st:0, isNew:false };
  renderJournal();
}
function backFromJournal(){ jw = { comp:null, screen:'plan', st:0, isNew:false }; renderJournal(); }
function openNewComp(){
  const a = A();
  const c = {
    id:'new'+Date.now().toString(36), kind:'competition', startH:9, state:'new', daysAway:7,
    name:'תחרות חדשה', date:'(הוספת תאריך)', place:'(מקום)',
    sched:[], todo:[], stages:[], tplId:null, fromTpl:null,
  };
  a.comps.unshift(c);
  jw = { comp:c.id, screen:'build', st:0, isNew:true };
  renderJournal();
}

/* מסך א׳ — Race Builder: templates + stage add/rename/reorder/delete */
function backFromBuild(){
  const c = getComp(jw.comp);
  if (jw.isNew && c && c.state==='new' && !(c.stages||[]).length){
    A().comps = A().comps.filter(x=>x.id!==c.id);
    jw = { comp:null, screen:'plan', st:0, isNew:false };
  } else if (c){
    jw = { comp:c.id, screen:'plan', st:0, isNew:false };
  } else {
    jw = { comp:null, screen:'plan', st:0, isNew:false };
  }
  renderJournal();
}
function setStartH(h){
  const c = getComp(jw.comp);
  c.startH = h;
  if (c.tplId==='club') c.sched = genSchedule(h);
  renderJournal();
}
function pickTpl(ti){
  const c = getComp(jw.comp);
  const t = RACE_TEMPLATES[ti];
  c.tplId = t.id;
  c.kind = t.kind || 'competition';
  c.stages = t.stages.map(n=>({ n, t:'', str:'', act:'', nutr:[] }));
  if (t.kind==='test') c.name = 'מבחן בריכה (חדש)';
  else if (t.id==='tri') c.name = 'טריאתלון (חדש)';
  else if (t.id==='run') c.name = 'מרתון (חדש)';
  else c.name = 'תחרות בריכה (חדשה)';
  if (t.fromClub){
    c.todo = JSON.parse(JSON.stringify(CLUB_TEMPLATE.todo));
    c.sched = genSchedule(c.startH||9);
    c.fromTpl = CLUB_TEMPLATE.name;
  } else {
    c.todo = []; c.sched = []; c.fromTpl = null;
  }
  renderJournal();
}
function renameStage(i,v){ getComp(jw.comp).stages[i].n = v; }
function setStageTime(i,v){ getComp(jw.comp).stages[i].t = v; }
function addStage(){ getComp(jw.comp).stages.push({ n:'שלב חדש', t:'', str:'', act:'', nutr:[] }); renderJournal(); }
function delStage(i){ const c=getComp(jw.comp); c.stages.splice(i,1); renderJournal(); }
function setCompMeta(f,v){ const c=getComp(jw.comp); if(!v || !v.trim()) return; c[f]=v.trim(); renderJournal(); }
function moveStage(i,dir){
  const c = getComp(jw.comp);
  const b = i + dir;
  if (b<0 || b>=(c.stages||[]).length) return;
  const it = c.stages.splice(i,1)[0];
  c.stages.splice(b,0,it);
  renderJournal();
}
function continueToPlan(){
  const c = getComp(jw.comp);
  if (!(c.stages||[]).length){ alert('WIREFRAME — צריך לפחות שלב אחד'); return; }
  c.state = 'plan';
  jw = { comp:c.id, screen:'plan', st:0, isNew:false };
  renderJournal();
}
function renderCompBuilder(){
  const c = getComp(jw.comp);
  if (!c){ backFromJournal(); return; }
  const showTpls = jw.isNew && !(c.stages||[]).length;
  const timeOpts = [ { h:9, l:'בוקר · 09:00' }, { h:16.5, l:'אחר הצהריים · 16:30' }, { h:19, l:'ערב · 19:00' } ];
  let html = `
    <button class="wiz-back" onclick="backFromBuild()"><svg class="icon-xs"><use href="#i-chevron-right"/></svg> חזרה</button>
    <div class="comp-head" style="margin-top:8px;">
      <svg class="icon" style="color:var(--danger)"><use href="#${c.kind==='test'?'i-clipboard':'i-trophy'}"/></svg>
      <div class="comp-name">מסך א׳ — מבנה התחרות<div class="comp-sub">כל שלב מקבל כרטיסיית תכנון משלו (אסטרטגיה + דלק) — ניתן להוסיף, לשנות שם, לגרור ולמחוק</div></div>
    </div>
    <div class="jrow" style="padding:2px 0"><span class="k">שם האירוע</span>
      <input class="feel-input" value="${c.name}" onchange="setCompMeta('name',this.value)">
    </div>
    <div class="jrow" style="padding:2px 0"><span class="k">תאריך</span>
      <input class="feel-input" value="${c.date}" onchange="setCompMeta('date',this.value)">
    </div>
    <div class="jrow" style="padding:2px 0"><span class="k">מקום</span>
      <input class="feel-input" value="${c.place}" onchange="setCompMeta('place',this.value)">
    </div>
    <div class="jrow" style="padding:2px 0"><span class="k" style="min-width:64px">שעת הזינוק</span>
      <div class="jchips">${timeOpts.map(o=>`<button class="jchip ${c.startH===o.h?'on':''}" onclick="setStartH(${o.h})">${o.l}</button>`).join('')}</div>
    </div>`;
  if (showTpls){
    html += `
      <div class="routine-sec" style="margin-top:10px;"><svg><use href="#i-shield"/></svg> תבניות מוכנות — נקודת פתיחה, לא גדר</div>
      <div class="tpl-pick">${RACE_TEMPLATES.map((t,ti)=>`
        <button class="tpl-item ${c.tplId===t.id?'on':''}" onclick="pickTpl(${ti})">
          <span class="t1"><svg><use href="#${t.icon}"/></svg> ${t.name}</span>
          <span class="t2">${t.sub}</span>
        </button>`).join('')}</div>`;
  }
  html += `<div class="routine-sec" style="margin-top:12px;"><svg><use href="#i-activity"/></svg> שלבי התחרות · גרירה או חצים לשינוי הסדר</div>`;
  html += (c.stages||[]).map((s,i)=>`
    <div class="stage-row" draggable="true"
         ondragstart="dragStart(event,'stage',${i})"
         ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropOn(event,'stage',${i})">
      <div class="stage-move">
        <button title="העלה" onclick="moveStage(${i},-1)"><svg class="icon-xs"><use href="#i-chev-up"/></svg></button>
        <button title="הורד" onclick="moveStage(${i},1)"><svg class="icon-xs"><use href="#i-chev-dn"/></svg></button>
      </div>
      <svg class="icon-xs grip-dots"><use href="#i-grip"/></svg>
      <input class="stage-n" value="${s.n}" placeholder="שם השלב" oninput="renameStage(${i},this.value)">
      <input class="stage-t" value="${s.t||''}" placeholder="08:30" onchange="setStageTime(${i},this.value)">
      <button class="stage-del" onclick="delStage(${i})"><svg class="icon-xs"><use href="#i-x"/></svg></button>
    </div>`).join('');
  html += `<button class="add-mini" onclick="addStage()"><svg><use href="#i-plus"/></svg> הוסף שלב</button>

  $('phBody').innerHTML = html;
}

/* מסך ב׳ — תכנון: לוז דינמי (שורות מאמנת נעולות) + צ׳קליסט חופשי + כרטיסיות שלבים עם אסטרטגיה ותזונה */
function toggleTodo(i){ const c=getComp(jw.comp); c.todo[i].on=!c.todo[i].on; renderJournal(); }
function delTodo(i){ const c=getComp(jw.comp); c.todo.splice(i,1); renderJournal(); }

function renderPlan(){
  const c = getComp(jw.comp);
  if (!c){ backFromJournal(); return; }
  const stages = c.stages||[];
  const sti = Math.min(jw.st, Math.max(stages.length-1, 0));
  const st = stages[sti];
  let html = `
    <button class="wiz-back" onclick="backFromJournal()"><svg class="icon-xs"><use href="#i-chevron-right"/></svg> חזרה לרשימה</button>
    <div class="comp-head" style="margin-top:8px;">
      <svg class="icon" style="${c.kind==='test'?'color:var(--warning)':'color:var(--danger)'}"><use href="#${c.kind==='test'?'i-clipboard':'i-trophy'}"/></svg>
      <div class="comp-name">${c.name}<div class="comp-sub">${c.date} · ${c.place}</div></div>
      <span class="comp-state ${c.state==='sent'?'cs-sent':'cs-plan'}">${c.state==='sent'?'הוגש למאמנת':'טיוטה בתכנון'}</span>
    </div>
    ${c.fromTpl?`<div style="display:flex;align-items:center;gap:5px;color:var(--accent);font-size:10.5px;font-weight:800;margin-top:8px;"><svg class="icon-xs"><use href="#i-shield"/></svg> הוכן מתבנית המאמנת — מותאם אישית מכאן</div>`:''}
    <div class="comp-sec" style="margin-top:12px;">מסך ב׳ · לוז ואירועים — מסודר לפי שעה</div>`;
  html += sortRows(c.sched||[]).map(r=>`
    <div class="tl-row"><span class="tl-t">${r.t}</span><span style="flex:1;min-width:0">${r.x}</span>${r.src==='coach'?`<span class="lock-badge"><svg><use href="#i-shield"/></svg> מהמאמנת</span>`:''}</div>`).join('');
  html += `<button class="add-mini" onclick="openAddItem('sched')"><svg><use href="#i-plus"/></svg> הוספת שעה — מושבצת לפי הזמן</button>`;
  html += `
    <div class="routine-sec" style="margin-top:14px;"><svg><use href="#i-clipboard"/></svg> צ׳קליסט חופשי — משימות לפני האירוע</div>
    ${(c.todo||[]).map((t,ti)=>`
      <div class="ck-row" style="cursor:default">
        <span class="ck ${t.on?'on':''}" onclick="toggleTodo(${ti})">${t.on?'<svg style="width:11px;height:11px"><use href="#i-check"/></svg>':''}</span>
        <span style="flex:1;min-width:0">${t.x}</span>
        <button class="nutr-x" onclick="delTodo(${ti})"><svg class="icon-xs"><use href="#i-x"/></svg></button>
      </div>
      ${t.prob?`<div class="prob-note" style="margin-top:2px"><svg><use href="#i-alert"/></svg> מהפעם הקודמת: ${t.prob}</div>`:''}`).join('')}
    <button class="add-mini" onclick="openAddItem('todo')"><svg><use href="#i-plus"/></svg> הוספת משימה</button>
    <div class="routine-sec" style="margin-top:14px;"><svg><use href="#i-activity"/></svg> שלבי התחרות — אסטרטגיה ותזונה לכל שלב</div>
    <div class="st-tabs">${(stages.length? stages.map((s,i)=>`
      <button class="st-tab ${i===sti?'on':''}" onclick="jw.st=${i};renderJournal()"><svg><use href="#i-activity"/></svg> ${s.n}</button>`).join('')
      : `<button class="demo-chip" style="color:var(--accent)" onclick="jw.screen='build';renderJournal()">אין שלבים — לסעיף בונה המבנה</button>`)}</div>`;
  if (st) html += renderStagePanel(stages, sti);
  html += `
    <div class="wiz-nav">
      <button class="wiz-copy ${c.copied?'done':''}" onclick="openWizCopy('all')"><svg class="icon-sm"><use href="#i-copy"/></svg> ${c.copied? 'הועתק מ'+c.copied : 'העתקה כוללת'}</button>
      <button class="wiz-next" onclick="submitPlan()">${c.state==='sent'?'עדכון — נשלח למאמנת':'סיום תכנון — שליחה למאמנת'} <svg class="icon-sm"><use href="#i-chevron-left"/></svg></button>
    </div>
    <div style="display:flex;justify-content:center;gap:12px;margin:2px 0 10px;">
      <button class="demo-chip" onclick="openDebrief()">דמו: אחרי התחרות — "סיום תחרות" פותח את מסך התחקיר</button>
      <button class="demo-chip" style="color:var(--accent)" onclick="jw.screen='build';jw.isNew=false;renderJournal()"><svg><use href="#i-activity"/></svg> עריכת מבנה השלבים</button>
    </div>`;
  $('phBody').innerHTML = html;
}
/* השלב הפעיל — אסטרטגיה (הכתוב שלי + המאמנת) ודלק פר שלב */
function renderStagePanel(stages, si){
  const s = stages[si];
  const c = getComp(jw.comp);
  const doneChip = s.str && s.str.trim() ? `<span class="comp-state cs-done">תוכנן</span>` : '';
  return `
    <div class="sb-block" style="margin-top:0;">
      <div class="race-h" style="display:flex;align-items:center;gap:6px;">
        <svg class="icon-sm" style="color:var(--accent)"><use href="#i-activity"/></svg>
        <span style="flex:1">${s.n}${s.t?` · ${s.t}`:''}</span>${doneChip}
      </div>
      ${s.tip?`<div class="prob-note" style="margin-top:7px"><svg><use href="#i-alert"/></svg> מסקנה מהתחרות הקודמת: ${s.tip}</div>`:''}
      ${s.str && s.str.trim()
        ? `<div class="plan-mine" style="margin-top:7px;font-size:11.5px;line-height:1.55;">${s.str}</div>`
        : `<div class="plan-empty" style="margin-top:7px;">עדיין לא נכתב — אסטרטגיה: פתיחה, קצב, פניות, מיקום.</div>`}
      <button class="plan-edit" style="margin-top:5px" onclick="openStageEdit(${si})"><svg><use href="#i-pencil"/></svg> ${s.str? 'עריכת האסטרטגיה' : 'כתוב אסטרטגיה'}</button>
      ${s.coach?`<div class="plan-coach" style="margin-top:7px;"><svg><use href="#i-msg"/></svg> מה חסר לדעת המאמנת: ${s.coach}</div>`:''}
      <div class="routine-sec" style="margin-top:10px;font-size:10.5px;">
        <svg><use href="#i-flame"/></svg> דלק בשלב הזה
        <button class="precise-toggle ${c.precise?'on':''}" onclick="togglePrecise()">${c.precise?'מדויק — גרף ומותגים':'מצב מדויק'}</button>
      </div>
      ${(s.nutr||[]).map((n,ni)=>`
        <div class="nutr-block">
          <div class="nutr-row">
            <input class="nutr-when" value="${n.t}" placeholder="מתי — 45 דק׳ לפני / קמ 5" oninput="setNutr(${si},${ni},'t',this.value)">
            <input class="nutr-what" value="${n.x}" placeholder="מה — גל / איזוטוני" oninput="setNutr(${si},${ni},'x',this.value)">
            <button class="nutr-x" onclick="delNutrRow(${si},${ni})"><svg class="icon-xs"><use href="#i-x"/></svg></button>
          </div>
          ${c.precise ? `
            ${(n.items||[]).map((it,ii)=>`
              <div class="meal-item">
                <span class="meal-n">${it.n}</span>
                <input class="meal-q" value="${it.qty}" onchange="setMealQty(${si},${ni},${ii},this.value)">
                <span class="meal-u">${it.u}</span>
                <span class="meal-m">${itemMacros(it)}</span>
                <button class="meal-x" onclick="delMealItem(${si},${ni},${ii})"><svg class="icon-xs"><use href="#i-x"/></svg></button>
              </div>`).join('')}
            ${(n.items && n.items.length) ? `<div class="meal-tot"><span>סה״כ השורה</span><span>${mealTotals(n)}</span></div>` : ''}
            <button class="photo-btn" onclick="document.getElementById('ph-${si}-${ni}').click()">
              <svg class="icon-xs"><use href="#i-plus"/></svg> ${n.photo ? 'החלפת תמונה' : 'צריפת תמונת ארוחה — לזיהוי אוטומטי'}
            </button>
            <input type="file" accept="image/*" id="ph-${si}-${ni}" style="display:none" onchange="addPhoto(${si},${ni},this)">
            <button class="add-mini" style="margin-top:6px" onclick="openFoodAdd(${si},${ni})"><svg><use href="#i-plus"/></svg> הוספת מזון / מוצר (גרם · מותג)</button>
          ` : ''}
          ${n.prob?`<div class="prob-note" style="margin-top:4px"><svg><use href="#i-alert"/></svg> מהפעם הקודמת: ${n.prob}</div>`:''}
        </div>`).join('')}
      <button class="add-mini" onclick="addNutrRow(${si})"><svg><use href="#i-plus"/></svg> הוספת בלוק דלק — מתי ומה</button>
      <button class="add-mini" style="margin-top:6px" onclick="openWizCopy('stage')"><svg><use href="#i-copy"/></svg> העתק אל השלב הזה — מתחרות קודמת או מהתבנית</button>
    </div>`;
}
function openStageEdit(si){
  const c = getComp(jw.comp);
  const s = c.stages[si];
  openSheet(`
    <div class="sh-grip"></div>
    <div class="sh-title"><svg class="icon"><use href="#i-pencil"/></svg> האסטרטגיה שלי — ${s.n}</div>
    <div class="sh-sub"><span>כתיבה חופשית — מהלך, קצב, פניות, מיקום</span><span>אתה כותב · המאמנת קוראת ומגיבה מה חסר</span></div>
    ${s.tip?`<div class="prob-note" style="margin-top:8px"><svg><use href="#i-alert"/></svg> מסקנה מהתחרות הקודמת: ${s.tip}</div>`:''}
    ${s.coach?`<div class="plan-coach" style="margin-top:8px"><svg><use href="#i-msg"/></svg> המאמנת: ${s.coach}</div>`:''}
    <textarea class="jtextarea" id="seText" rows="4" style="margin-top:10px" placeholder="לדוגמה: פתיחה חזקה + מתי לנשום + קצב הסלול">${s.str||''}</textarea>
    <button class="rp-save" onclick="saveStageStr(${si})"><svg class="icon-sm" style="vertical-align:-3px"><use href="#i-check"/></svg> שמירת האסטרטגיה</button>
    <button class="sh-close" onclick="closeSheet()">ביטול</button>
  `);
}
function saveStageStr(si){
  getComp(jw.comp).stages[si].str = $('seText').value.trim();
  closeSheet();
  renderJournal();
}
function setNutr(si,ni,f,v){ getComp(jw.comp).stages[si].nutr[ni][f] = v; }

/* סיום תכנון → הגשה למאמנת (עריכה אחרי תגובה עדיין חופשית); לולאת התגובה: המשוב חוזר לאתלט */
function submitPlan(){
  const c = getComp(jw.comp);
  if (!c) return;
  const isResend = c.state==='sent';
  c.state = 'sent';
  A().msgs.unshift({ icon:'i-send', title:(isResend?'עדכון ההכנה':'ההכנה הוגשה')+' — '+c.name, body:'לוז, משימות, אסטרטגיה לכל שלב ודלק — בדרך למאמנת. התשובה תופיע כאן.', time:'עכשיו', unread:true });
  renderJournal();

  `);

function applyCopy(srcKind, target){
  const a = A();
  const c = getComp(jw.comp);
  if (!c || !a.compPast) return;
  const src = a.compPast;
  /* שורות המקצים שפרסמה המאמנת נשארות נעולות (src:'coach') בכל העתקה */
  const coachRows = (c.sched||[]).filter(r=>r.src==='coach');
  let ok = true;
  if (srcKind==='club'){
    if (target==='all'){
      c.sched = [...genSchedule(c.startH||9), ...coachRows];
      c.todo = JSON.parse(JSON.stringify(CLUB_TEMPLATE.todo));
      if (!(c.stages||[]).length) c.stages = CLUB_TEMPLATE.stages.map(n=>({ n, t:'', str:'', act:'', nutr:[] }));
      c.copied = CLUB_TEMPLATE.name;
    } else {
      alert('WIREFRAME — לתבנית המאמנת אין אסטרטגיה אישית לשלב. העתק מתחרות קודמת, או כתוב בעצמך.');
      ok = false;
    }
  } else if (target==='all'){
    c.sched = [...src.timeline.map(t=>({ t:t.t, x:t.x })), ...coachRows];
    c.todo = src.gear.map(g=>({ x:g.x, on:false, prob:g.prob||null }));
    (c.stages||[]).forEach((s,i)=>{
      const past = (src.races && (src.races[i] || src.races[0])) || null;
      if (!past) return;
      s.str = pastPlanText(past);
      s.tip = pastStageTip(past);
    });
    c.copied = src.name;
  } else {
    const i = jw.st;
    const past = src.races && (src.races[i] || src.races[0]);
    if (past){
      c.stages[i].str = pastPlanText(past);
      c.stages[i].tip = pastStageTip(past);
    }
    const pn = (src.nutrition.blocks||[]).filter(b=>b.prob);
    c.stages[i].nutr = pn.map(b=>({ t:b.when||'', x:b.what||'', prob:b.prob||null, items: c.precise ? [] : undefined }));
  }
  if (!ok) return;
  closeSheet();
  renderJournal();
}

/* ==================== DRAG REORDER — stages ==================== */
let dragInfo = null;
function dragStart(e, list, a, ri){
  dragInfo = { list, a, ri: ri||0 };
  e.dataTransfer.setData('text/plain','reorder');
  e.stopPropagation();
}
function allowDrop(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function dropOn(e, list, b, ri){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (!dragInfo || dragInfo.list!==list || dragInfo.a===b) { dragInfo=null; return; }
  const c = getComp(jw.comp);
  const it = c.stages.splice(dragInfo.a,1)[0];
  c.stages.splice(b,0,it);
  dragInfo = null;
  renderJournal();
}

/* שורות הלוז — מסודרות כרונולוגית; "ערב לפני" נשאר ראשון גם כשהתחרות אחר הצהריים/בערב */
function tToMin(t){
  const m = (t||'').match(/^(\d{1,2}):(\d{2})$/);
  return m ? (+m[1])*60+(+m[2]) : 99999;
}
function sortRows(rows){
  return (rows||[]).slice().sort((x,y)=>{
    const kx = (x.x||'').startsWith('ערב לפני') ? -100 : tToMin(x.t);
    const ky = (y.x||'').startsWith('ערב לפני') ? -100 : tToMin(y.t);
    return kx-ky;
  });
}

      </div>`).join('');
  } else {
    html += `<div class="sh-adapt" style="background:var(--surface-hover);color:var(--text-muted)"><svg class="icon-sm"><use href="#i-note"/></svg> פירוט הסטים יתווסף בגרסה הבאה של הווירפריים</div>`;
  }
  html += `<button class="sh-close" onclick="closeSheet()">סגור</button>`;
  openSheet(html);
}

/* ==================== REPORT SHEET ==================== */
let rpCtx = { id:null, done:true, rpe:6 };
function openReport(sid){
  const s = A().sessions.find(x=>x.id===sid);
  if (!s) return;
  rpCtx = { id:sid, done:true, rpe:6 };
  openSheet(`
    <div class="sh-grip"></div>
    <div class="sh-title"><svg class="icon"><use href="#i-check"/></svg> דיווח אימון — ${s.name}</div>
    <div class="sh-sub"><span>${DAYS[s.d].l}׳ · ${s.time}</span></div>
    <div class="rp-row">
      <button class="rp-opt sel-done" id="rpDone" onclick="setRpDone(true)"><svg class="icon-sm"><use href="#i-check"/></svg> בוצע</button>
      <button class="rp-opt" id="rpMiss" onclick="setRpDone(false)"><svg class="icon-sm"><use href="#i-x"/></svg> לא בוצע</button>
    </div>
    <div style="font-size:11.5px;font-weight:800;color:var(--text-muted);margin-top:10px;">מאמץ מורגש (RPE 1–10)</div>
    <div class="rpe-chips" id="rpeChips"></div>
    <textarea class="rp-input" id="rpNote" rows="2" placeholder="הערה למאמנת (רשות) — למשל: כתף כאבה בסוף"></textarea>
    <button class="rp-save" onclick="saveReport()"><svg class="icon-sm" style="vertical-align:-3px"><use href="#i-send"/></svg> שמור דיווח</button>
  `);
  renderRpe();
}
function setRpDone(v){
  rpCtx.done = v;
  $('rpDone').className = 'rp-opt' + (v?' sel-done':'');
  $('rpMiss').className = 'rp-opt' + (!v?' sel-miss':'');
}
function renderRpe(){
  $('rpeChips').innerHTML = Array.from({length:10},(_,i)=>i+1).map(n=>
    `<button class="rpe ${rpCtx.rpe===n?'sel':''}" onclick="setRpe(${n})">${n}</button>`).join('');
}
function setRpe(n){ rpCtx.rpe = n; renderRpe(); }
function saveReport(){
  const s = A().sessions.find(x=>x.id===rpCtx.id);
  if (!s) return;
  s.reported = { done: rpCtx.done, rpe: rpCtx.rpe, note: $('rpNote').value };
  closeSheet();
  renderWeek();
}

/* ==================== SHEET ==================== */
function openSheet(html){
  $('sheetBox').innerHTML = html;
  $('sheetBox').classList.add('open');
  $('sheetBg').classList.add('open');
  sheetOpen = true;
}
function closeSheet(){
  $('sheetBox').classList.remove('open');
  $('sheetBg').classList.remove('open');
  sheetOpen = false;
}

/* ==================== INIT ==================== */
renderAthSeg();
renderAll();
</script>
